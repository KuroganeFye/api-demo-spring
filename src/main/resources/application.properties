spring.application.name=apidemo
# Conexión a la base de datos MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/apidemo_db
spring.datasource.username={DB_USER}
spring.datasource.password={DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Magia de Hibernate (JPA)
# 'update' le dice a Spring que cree o actualice las tablas automáticamente según tus clases
spring.jpa.hibernate.ddl-auto=update

# Esto es opcional, pero te imprimirá en la terminal los comandos SQL que Spring hace por detrás
spring.jpa.show-sql=true